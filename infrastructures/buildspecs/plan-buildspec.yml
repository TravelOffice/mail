version: 0.2
env:
  variables:
    JAVA_HOME: "/usr/lib/jvm/java-17-amazon-corretto/"
phases:
  install:
    commands:
      # install terraform binary
      - curl -s -qL -o terraform_install.zip https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip
      - unzip terraform_install.zip -d /usr/bin/
      - chmod +x /usr/bin/terraform
      - apt-get update; apt-get install -y java-17-amazon-corretto-jdk
      - update-alternatives --auto javac
      - update-alternatives --auto java
    finally:
      - java --version
      - terraform --version

  pre_build:
    commands:
      - chmod +x ./scripts/*.sh
      - ./scripts/execute_terraform.sh $BUILD_ENV init -backend-config "bucket=$TF_BUCKET"
      - ./scripts/execute_terraform.sh $BUILD_ENV validate
  
  build:
    commands:
      - ./scripts/build_service.sh $BUILD_ENV
      - ./scripts/execute_terraform.sh $BUILD_ENV plan -var="TF_BUCKET=$TF_BUCKET" -var="ENV=$BUILD_ENV"

artifacts:
  files:
    - '**/*'
  enable-symlinks: yes

